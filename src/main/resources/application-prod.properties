# Perfil de produccion: PostgreSQL externo via variables de entorno
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:procesos}
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=${DB_USER:procesos}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate

# El esquema lo crea Flyway (db/migration); Hibernate solo lo valida contra las entidades
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/common,classpath:db/migration/postgresql
spring.flyway.baseline-on-migrate=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.h2.console.enabled=false

# Swagger apagado en produccion: publica el mapa completo de la API
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

jwt.secret=${JWT_SECRET}
